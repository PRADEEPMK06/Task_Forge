<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- Primary SEO -->
<title>TaskForge - Smart Task Management & Productivity Tool</title>
<meta
  name="description"
  content="TaskForge helps you organize tasks, manage projects, track progress, and boost productivity with a simple and powerful task management platform."
/>

<!-- Canonical URL -->
<!-- Replace with your actual production domain -->
<link rel="canonical" href="https://yourdomain.com/" />

<!-- Favicon -->
<link rel="icon" type="image/x-icon" href="/favicon.ico" />

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website" />
<meta property="og:title" content="TaskForge - Smart Task Management & Productivity Tool" />
<meta
  property="og:description"
  content="Organize tasks, manage projects, track progress, and boost productivity with TaskForge."
/>
<!-- Replace with your actual image URL -->
<meta property="og:image" content="https://yourdomain.com/og-image.png" />
<meta property="og:url" content="https://yourdomain.com/" />
<meta property="og:site_name" content="TaskForge" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta
  name="twitter:title"
  content="TaskForge - Smart Task Management & Productivity Tool"
/>
<meta
  name="twitter:description"
  content="Organize tasks, manage projects, track progress, and boost productivity with TaskForge."
/>
<meta name="twitter:image" content="https://yourdomain.com/og-image.png" />

<!-- Structured Data / JSON-LD -->
<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "TaskForge",
    "description": "A smart task management and productivity platform for organizing tasks, managing projects, and tracking progress.",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "url": "https://yourdomain.com/"
  }
</script>

  </head>
